<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Log In or Sign Up</title>  
    <script src="script.js" defer></script>
  </head>
<body>
  <header>
      <div style="display: flex;"> <!-- Can't be fucked doing this in style.css -->
        <img class="header_logo" src="./logo temp.png" alt="logo" width="64" height="64">
        <h1 class="main_title">Solar Saver</h1>
      </div>
      <div class="header_links">
        <a class="index_home" href="index.html">Home</a> |
        <a class="index_calc" href="calc_house.html">Calculator</a> |
        <a class="index_prov" href="prov.html">Providers</a>
      </div>
      <div class="header_buttons">
          <button class="index_button1">Button1</button>
          <button class="index_button2">Button2</button>
      </div>
    </header>
  <div class="login_details">
    <h1>Login</h1>
    <div>
      <h3>Email</h3>
      <input class="login_text_input" type="email" name="email" placeholder="Jane.Doe@example.com">
    </div>
    <div>
    <div>
      <h3>Password</h3>
      <input class="login_text_input" type="password" name="password" placeholder="*******">
      <span class="login_small_text">Requires Letters and Numbers</span>
    </div>
    <button class="login_confirm">Confirm</button>
  </div>
</body>
</html>
