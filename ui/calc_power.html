<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator Power</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div style="display: flex;"> <!-- Can't be fucked doing this in style.css -->
        <img class="header_logo" src="./logo temp.png" alt="logo" width="64" height="64">
        <h1 class="main_title">Solar Saver</h1>
      </div>
      <div class="header_links">
        <a class="index_home" href="index.html">Home</a> |
        <a class="index_calc" href="calc_house.html">Calculator</a> |
        <a class="index_prov" href="prov.html">Providers</a>
      </div>
      <div class="header_buttons">
          <button class="index_button1">Button1</button>
          <button class="index_button2">Button2</button>
      </div>
    </header>
    <div class="calc_power_details">
        <h1>Power Information</h1>
        <h2>Recent electric bill details and planned solar power details</h2>
        <div>
          <h3>Last Electric Bill</h3>
          <input class="calc_power_text_input" type="text" name="last_electric_bill" placeholder="$0000">
        </div>
        <div>
          <h3>Daily Usage Avg.</h3>
          <input class="calc_power_text_input" type="text" name="daily_use_kwh" placeholder="kWh">
          Optional
        </div>
        <div>
          <h3>Solar System Size</h3>
          <input class="calc_power_text_input" type="range" name="size_kwh" placeholder="kW">
        </div>
        <div>
          <h3>Bill Period</h3>
          <select class="calc_power_select" name="period">
            <option value="annual">Anually</option>
            <option value="quarter">Quarterly</option>
            <option value="month">Monthly</option>
            <option value="week">Weekly</option>
          </select>
        </div>
        <div>
          <h3>Cost Per kWh</h3>
          <input class="calc_power_text_input" type="number" name="cost_per_kwh" placeholder="$0.00">
        </div>
        <div>
          <h3>Add Solar Battery</h3>
          <select class="calc_power_select" name="solar_battery">
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <button class="calc_power_calculate">Calculate</button>
    </div>
  </body>
</html>
