<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Log In or Sign Up</title>
    <script src="script.js" defer></script>
  </head>
<body>
  <header>
      <div style="display: flex;"> <!-- Can't be fucked doing this in style.css -->
        <img class="header_logo" src="./logo temp.png" alt="logo" width="64" height="64">
        <h1 class="main_title">Solar Saver</h1>
      </div>
      <div class="header_links">
        <a class="index_home" href="index.html">Home</a> |
        <a class="index_calc" href="calc_house.html">Calculator</a> |
        <a class="index_prov" href="prov.html">Providers</a>
      </div>
      <div class="header_buttons">
          <button class="index_button1">Button1</button>
          <button class="index_button2">Button2</button>
      </div>
    </header>
    <hr>
    <div class="signup_details">
      <h1>Personal Details</h1>
      <div>
        <h3>Name</h3>
        <input class="signup_text_input" type="text" name="name" placeholder="Firstname Lastname">
      </div>
      <div>
        <h3>Email</h3>
        <input class="signup_text_input" type="email" name="email" placeholder="Jane.Doe@example.com">
      </div>
      <div>
        <h3>Phone Number</h3>
        <input class="signup_text_input" type="number" name="phone_number" placeholder="12345678">
        <span class="signup_small_text">Optional</span>
      </div>
      <div>
        <h3>Password</h3>
        <input class="signup_text_input" type="password" name="password" placeholder="*******">
        <span class="signup_small_text">Requires Letters and Numbers</span>
      </div>
      <div>
        <div>
          <input type="checkbox" name="terms">
          <label for="terms">Terms & Conditions</label>
        </div>
        <div>
          <input type="checkbox" name="connect">
          <label for="connect">Connect to Solar Providers</label>
        </div>
        <div>
          <input type="checkbox" name="news">
          <label for="news">News</label>
        </div>
      </div>
      <button class="signup_confirm">Confirm</button>
    </div>
</body>
</html>
